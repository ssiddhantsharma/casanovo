minal-187321594-r1" clip-path="url(#terminal-187321594-line-2)" textLength="24.4">]</text><text x="329.4" y="68.8" class="terminal-187321594-r4" clip-path="url(#terminal-187321594-line-2)" textLength="85.4">COMMAND</text><text x="414.8" y="68.8" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-2)" textLength="24.4">[</text><text x="439.2" y="68.8" class="terminal-187321594-r4" clip-path="url(#terminal-187321594-line-2)" textLength="48.8">ARGS</text><text x="488" y="68.8" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-2)" textLength="488">]...</text><text x="439.2" y="117.6" class="terminal-187321594-r5" clip-path="url(#terminal-187321594-line-4)" textLength="97.6">Casanovo</text><text x="0" y="142" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-5)" textLength="976">Casanovo is a state-of-the-art deep learning tool designed for de novo peptide</text><text x="0" y="166.4" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-6)" textLength="976">sequencing. Powered by a transformer neural network, Casanovo &quot;translates&quot;</text><text x="0" y="190.8" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-7)" textLength="976">peaks in MS/MS spectra into amino acid sequences.</text><text x="0" y="239.6" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-9)" textLength="976">Links:</text><text x="12.2" y="288.4" class="terminal-187321594-r3" clip-path="url(#terminal-187321594-line-11)" textLength="36.6">•</text><text x="48.8" y="288.4" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-11)" textLength="927.2">Documentation: https://casanovo.readthedocs.io</text><text x="12.2" y="312.8" class="terminal-187321594-r3" clip-path="url(#terminal-187321594-line-12)" textLength="36.6">•</text><text x="48.8" y="312.8" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-12)" textLength="927.2">Official code repository: https://github.com/Noble-Lab/casanovo</text><text x="0" y="361.6" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-14)" textLength="976">If you use Casanovo in your work, please cite:</text><text x="12.2" y="410.4" class="terminal-187321594-r3" clip-path="url(#terminal-187321594-line-16)" textLength="36.6">•</text><text x="48.8" y="410.4" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-16)" textLength="927.2">Yilmaz, M., Fondrie, W. E., Bittremieux, W., Oh, S. &amp; Noble, W. S. De novo</text><text x="48.8" y="434.8" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-17)" textLength="927.2">mass spectrometry peptide sequencing with a transformer model. Proceedings</text><text x="48.8" y="459.2" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-18)" textLength="927.2">of the 39th International Conference on Machine Learning - ICML &apos;22 (2022).</text><text x="48.8" y="483.6" class="terminal-187321594-r6" clip-path="url(#terminal-187321594-line-19)" textLength="597.8">https://proceedings.mlr.press/v162/yilmaz22a.html</text><text x="646.6" y="483.6" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-19)" textLength="329.4">.</text><text x="0" y="532.4" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-21)" textLength="976">For more information on how to cite different versions of Casanovo, please see</text><text x="12.2" y="556.8" class="terminal-187321594-r6" clip-path="url(#terminal-187321594-line-22)" textLength="622.2">https://casanovo.readthedocs.io/en/latest/cite.html</text><text x="634.4" y="556.8" class="terminal-187321594-r1" clip-path="url(#terminal-187321594-line-22)" textLength="341.6">.</text><text x="0" y="605.6" class="terminal-187321594-r7" clip-path="url(#terminal-187321594-line-24)" textLength="24.4">╭─</text><text x="24.4" y="605.6" class="terminal-187321594-r7" clip-path="url(#terminal-187321594-line-24)" textLength="109.8">Options